<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Battle of the Verses</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#0a0a1a;color:#f0f0ff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;
  background-image:
    radial-gradient(ellipse at 15% 15%,rgba(120,60,220,0.2) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 85%,rgba(40,80,220,0.15) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 0%,rgba(200,160,30,0.1) 0%,transparent 50%);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 15%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 75% 45%,rgba(255,255,255,0.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 90% 80%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 20% 90%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 65% 60%,rgba(255,255,255,0.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 45% 40%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 5% 55%,rgba(255,255,255,0.3) 0%,transparent 100%);
}

header{
  text-align:center;padding:24px 20px 16px;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
header h1{
  font-size:clamp(1.6rem,4vw,3rem);font-weight:900;letter-spacing:0.04em;
  background:linear-gradient(135deg,#f0c040 0%,#c084fc 50%,#60a5fa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
header p{color:rgba(255,255,255,0.3);font-size:clamp(0.65rem,1.2vw,0.85rem);
  margin-top:5px;letter-spacing:0.15em;text-transform:uppercase}

/* Chart container — this is the key: fixed height so % works */
#chart{
  flex:1;display:flex;align-items:flex-end;
  padding:20px 32px 0;gap:clamp(6px,1.5vw,20px);
  position:relative;
}

.bar-col{
  flex:1;display:flex;flex-direction:column;align-items:center;
  height:100%;
}

/* The track the bar grows inside */
.bar-track{
  flex:1;width:100%;display:flex;align-items:flex-end;
  position:relative;
}

.bar{
  width:100%;
  border-radius:10px 10px 0 0;
  height:6px; /* start tiny */
  transition:height 0.9s cubic-bezier(0.34,1.2,0.64,1);
  position:relative;overflow:hidden;
  min-height:6px;
}
.bar::after{
  content:'';position:absolute;top:0;left:0;width:35%;height:100%;
  background:linear-gradient(90deg,rgba(255,255,255,0.2),transparent);
  pointer-events:none;
}

.clan-label{
  flex-shrink:0;text-align:center;
  padding:10px 2px 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.clan-emoji{font-size:clamp(1.1rem,2.2vw,1.8rem)}
.clan-name{
  font-size:clamp(0.5rem,1vw,0.75rem);
  color:rgba(255,255,255,0.65);font-weight:600;
  white-space:nowrap;
}

footer{
  text-align:center;padding:10px 20px 14px;flex-shrink:0;
  font-size:0.65rem;color:rgba(255,255,255,0.18);letter-spacing:0.05em;
}

@keyframes glow-pulse{
  0%{box-shadow:0 0 0px 0px rgba(255,255,255,0)}
  40%{box-shadow:0 0 18px 4px rgba(255,255,255,0.25)}
  100%{box-shadow:0 0 0px 0px rgba(255,255,255,0)}
}
.bar.flash{animation:glow-pulse 0.8s ease-out}
</style>
</head>
<body>
<header>
  <h1>⚔️ The Battle of the Verses</h1>
  <p>Live Leaderboard</p>
</header>

<div id="chart"></div>

<footer>Operation inCISive — Multiverse of Minions</footer>

<script>
const CLANS = [
  {id:'mystery', name:'Mystery', emoji:'💛', color:'#FFD700'},
  {id:'sky',     name:'Sky',     emoji:'🩵', color:'#87CEEB'},
  {id:'crimson', name:'Crimson', emoji:'❤️', color:'#8B0000'},
  {id:'shadow',  name:'Shadow',  emoji:'🖤', color:'#FFFFFF'},
  {id:'tech',    name:'Tech',    emoji:'💚', color:'#22C55E'},
  {id:'nova',    name:'Nova',    emoji:'🩷', color:'#EC4899'},
  {id:'chaos',   name:'Chaos',   emoji:'💜', color:'#A855F7'},
];

// Build DOM once
const chart = document.getElementById('chart');
chart.innerHTML = CLANS.map(c=>`
  <div class="bar-col">
    <div class="bar-track">
      <div class="bar" id="bar_${c.id}" style="background:${c.color}"></div>
    </div>
    <div class="clan-label">
      <span class="clan-emoji">${c.emoji}</span>
      <span class="clan-name">${c.name}</span>
    </div>
  </div>`).join('');

let prevTotals = {};

function updateChart(clans){
  const values = clans.map(c=>Math.max(c.total, 0));
  const max = Math.max(...values, 1);
  const trackH = document.querySelector('.bar-track')?.clientHeight || 300;

  clans.forEach(c=>{
    const bar = document.getElementById('bar_'+c.id);
    if(!bar) return;
    const val = Math.max(c.total, 0);
    // Scale so the tallest bar is 92% of track height, min 6px
    const px = max === 0 ? 6 : Math.max(Math.round((val / max) * trackH * 0.92), 6);
    bar.style.height = px + 'px';

    if(prevTotals[c.id] !== undefined && prevTotals[c.id] !== c.total){
      bar.classList.remove('flash');
      void bar.offsetWidth;
      bar.classList.add('flash');
    }
    prevTotals[c.id] = c.total;
  });
}

// Load initial data
fetch('/api/battle/totals').then(r=>r.json()).then(clans=>{
  // Small delay so CSS transition fires after first paint
  setTimeout(()=>updateChart(clans), 100);
});

// Live WebSocket with auto-reconnect
function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/battle`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.type === 'update') updateChart(d.clans);
  };
  ws.onclose = ()=>setTimeout(connectWS, 2000);
}
connectWS();

// Recalculate bar heights if window resizes
window.addEventListener('resize', ()=>{
  const clans = CLANS.map(c=>({...c, total: prevTotals[c.id]||0}));
  updateChart(clans);
});
</script>
</body>
</html>
