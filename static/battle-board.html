<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Battle of the Verses</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a1a;color:#f0f0ff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  height:100vh;overflow:hidden;display:flex;flex-direction:column;
  background-image:
    radial-gradient(ellipse at 15% 15%,rgba(120,60,220,0.2) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 85%,rgba(40,80,220,0.15) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 0%,rgba(200,160,30,0.1) 0%,transparent 50%);
}

/* Starfield */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 15%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 75% 45%,rgba(255,255,255,0.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 90% 80%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 20% 90%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 65% 60%,rgba(255,255,255,0.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 45% 40%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 5% 55%,rgba(255,255,255,0.3) 0%,transparent 100%);
}

header{
  text-align:center;padding:28px 20px 18px;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
header h1{
  font-size:clamp(1.6rem,4vw,2.8rem);font-weight:900;letter-spacing:0.04em;
  background:linear-gradient(135deg,#f0c040 0%,#c084fc 50%,#60a5fa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
header p{color:rgba(255,255,255,0.35);font-size:clamp(0.7rem,1.5vw,0.9rem);margin-top:6px;letter-spacing:0.15em;text-transform:uppercase}

.chart-area{
  flex:1;display:flex;align-items:flex-end;justify-content:center;
  padding:20px 24px 0;gap:clamp(8px,2vw,24px);overflow:hidden;
}

.bar-col{
  flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;
  gap:0;
}

.bar-wrap{
  width:100%;flex:1;display:flex;align-items:flex-end;
  position:relative;
}

.bar{
  width:100%;border-radius:10px 10px 0 0;
  min-height:12px;
  transition:height 0.8s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:hidden;
}

/* Shine effect */
.bar::after{
  content:'';position:absolute;top:0;left:0;width:40%;height:100%;
  background:linear-gradient(90deg,rgba(255,255,255,0.18) 0%,transparent 100%);
  border-radius:inherit;pointer-events:none;
}

.clan-label{
  text-align:center;padding:10px 4px 0;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.clan-emoji{font-size:clamp(1.2rem,2.5vw,2rem)}
.clan-name{
  font-size:clamp(0.55rem,1.2vw,0.8rem);color:rgba(255,255,255,0.7);
  font-weight:600;white-space:nowrap;
}

footer{
  text-align:center;padding:14px 20px 18px;flex-shrink:0;
  font-size:0.7rem;color:rgba(255,255,255,0.2);letter-spacing:0.05em;
}

/* Pulse animation when a bar updates */
@keyframes pulse-glow{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,0.5)}
  50%{box-shadow:0 0 20px 6px rgba(255,255,255,0.2)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.bar.updated{animation:pulse-glow 0.7s ease-out}
</style>
</head>
<body>
<header>
  <h1>⚔️ The Battle of the Verses</h1>
  <p>Live Leaderboard</p>
</header>

<div class="chart-area" id="chartArea"></div>

<footer>Operation inCISive — Multiverse of Minions</footer>

<script>
const CLANS = [
  {id:'mystery',name:'Mystery',  emoji:'💛',color:'#FFD700'},
  {id:'sky',    name:'Sky',      emoji:'🩵',color:'#87CEEB'},
  {id:'crimson',name:'Crimson',  emoji:'❤️',color:'#DC143C'},
  {id:'shadow', name:'Shadow',   emoji:'🖤',color:'#64748B'},
  {id:'tech',   name:'Tech',     emoji:'💙',color:'#2563EB'},
  {id:'nova',   name:'Nova',     emoji:'🩷',color:'#EC4899'},
  {id:'chaos',  name:'Chaos',    emoji:'💜',color:'#A855F7'},
];

let prevTotals = {};

function renderChart(clans){
  const maxTotal = Math.max(...clans.map(c=>c.total), 1);
  const minTotal = Math.min(...clans.map(c=>c.total), 0);
  const range = maxTotal - Math.min(minTotal, 0);
  const safeRange = range || 1;

  const area = document.getElementById('chartArea');

  // Build columns if not yet created
  if(!area.children.length){
    area.innerHTML = CLANS.map(c=>`
      <div class="bar-col" id="col_${c.id}">
        <div class="bar-wrap">
          <div class="bar" id="bar_${c.id}" style="background:${c.color};height:5%"></div>
        </div>
        <div class="clan-label">
          <span class="clan-emoji">${c.emoji}</span>
          <span class="clan-name">${c.name}</span>
        </div>
      </div>`).join('');
  }

  clans.forEach(c=>{
    const bar = document.getElementById('bar_'+c.id);
    if(!bar) return;
    const total = Math.max(c.total, 0);
    const pct = range === 0 ? 5 : Math.max((total - Math.min(minTotal,0)) / safeRange * 88 + 5, 5);
    const newH = pct.toFixed(1)+'%';
    if(bar.style.height !== newH){
      bar.style.height = newH;
      if(prevTotals[c.id] !== undefined && prevTotals[c.id] !== c.total){
        bar.classList.remove('updated');
        void bar.offsetWidth; // reflow to restart animation
        bar.classList.add('updated');
      }
    }
    prevTotals[c.id] = c.total;
  });
}

// Initial load
fetch('/api/battle/totals').then(r=>r.json()).then(renderChart);

// Live WebSocket
function connect(){
  const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/battle`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.type==='update') renderChart(d.clans);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
